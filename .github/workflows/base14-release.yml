name: base14-release

# base14 build of chproxy (fork of ContentSquare/chproxy). Tests, builds a static
# linux/arm64 binary and pushes the image to base14's ECR. arm64 only, like
# base14's other publishes: every target cluster is arm64.
# Manual only: run it from the Actions tab on master.
# Tag format: v<upstream>-b14.<n>, e.g. v1.30.0-b14.1.
# The chart lives in its own repository; bump its image tag there.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. v1.30.0-b14.1"
        required: true

permissions:
  contents: read
  id-token: write # AWS OIDC

env:
  AWS_ROLE: ${{ vars.BASE14_CDK_ASSUME_ROLE }}
  AWS_REGION: ${{ vars.BASE14_REGION }}
  REGISTRY: 010526246885.dkr.ecr.ap-south-1.amazonaws.com
  REPOSITORY: chproxy
  TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on:
      group: default
      labels: scout-hz-hel1-gha-runner
    timeout-minutes: 30
    steps:
      - name: Validate ref and tag
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::releases are built from master, got $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-b14\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' does not match v<upstream>-b14.<n>"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build linux/arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X main.buildTag=$TAG \
              -X main.buildRevision=$GITHUB_SHA \
              -X main.buildTime=$(date -u '+%Y-%m-%d_%H:%M:%S')" \
            -o chproxy .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: chproxy-release
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # The Dockerfile copies the prebuilt binary from the build context.
      - name: Build and push image
        run: |
          image="$REGISTRY/$REPOSITORY:$TAG"
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.title=chproxy" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=MIT" \
            --cache-from "type=gha,scope=chproxy-arm64" \
            --cache-to "type=gha,mode=max,scope=chproxy-arm64" \
            --tag "$image" \
            --push \
            .
          docker buildx imagetools inspect "$image"

      - name: Summary
        run: |
          echo "### chproxy image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REGISTRY/$REPOSITORY:$TAG\` (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
